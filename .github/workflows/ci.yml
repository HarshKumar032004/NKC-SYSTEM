name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # required for gitleaks

    - name: Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      run: pnpm --filter @nkc/backend run prisma generate

    - name: Run Linter
      run: pnpm run lint

    - name: Type Check Backend
      run: pnpm --filter @nkc/backend exec tsc --noEmit

    - name: Type Check Frontend
      run: pnpm --filter @nkc/frontend exec tsc --noEmit

    - name: Build Shared Types
      run: pnpm --filter @nkc/shared-types run build

    - name: Build Backend
      run: pnpm --filter @nkc/backend run build

    - name: Build Frontend
      run: pnpm --filter @nkc/frontend run build

    - name: Validate Prisma Schema
      run: pnpm --filter @nkc/backend exec prisma validate

    - name: RLS Tenant Isolation Check
      run: pnpm --filter @nkc/backend exec tsx test-rls.ts
